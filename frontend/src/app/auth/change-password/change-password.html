<div class="change-password-layout">

  <div class="card">
    <div class="card-icon">🔐</div>
    <h1>Changement de mot de passe requis</h1>
    <p class="subtitle">
      Bonjour <strong>{{ prenom }} {{ nom }}</strong>, pour des raisons de sécurité,
      vous devez changer votre mot de passe avant de continuer.
    </p>

    <div class="erreur" *ngIf="erreur">{{ erreur }}</div>
    <div class="succes" *ngIf="succes">✅ {{ succes }}</div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Mot de passe actuel (temporaire) *</label>
        <input
          type="password"
          [(ngModel)]="ancienMotDePasse"
          name="ancienMotDePasse"
          placeholder="Votre mot de passe reçu par email"
          required
        />
      </div>

      <div class="form-group">
        <label>Nouveau mot de passe *</label>
        <input
          type="password"
          [(ngModel)]="nouveauMotDePasse"
          name="nouveauMotDePasse"
          placeholder="Au moins 6 caractères"
          required
        />
      </div>

      <div class="form-group">
        <label>Confirmer le nouveau mot de passe *</label>
        <input
          type="password"
          [(ngModel)]="confirmerMotDePasse"
          name="confirmerMotDePasse"
          placeholder="Répétez le nouveau mot de passe"
          required
        />
      </div>

      <button type="submit" [disabled]="chargement" class="btn-submit">
        {{ chargement ? 'Enregistrement...' : 'Changer mon mot de passe →' }}
      </button>

    </form>

    <button class="btn-logout" (click)="logout()">Se déconnecter</button>
  </div>

</div>
