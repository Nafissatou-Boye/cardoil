spring.application.name=cardoil-backend
server.port=8080

# Base de données
spring.datasource.url=jdbc:mysql://localhost:3306/cardoil-bd
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
cardoil.jwt.secret=${JWT_SECRET}
cardoil.jwt.expiration=86400000

logging.level.org.springframework.security=TRACE

# Mail
spring.mail.host=mail.cardoilbo-test.com
spring.mail.port=587
spring.mail.username=contacts@cardoilbo-test.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.default-encoding=UTF-8