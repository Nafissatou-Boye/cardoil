spring.application.name=cardoil-backend
server.port=8080

# Base de donnees
spring.datasource.url=jdbc:mysql://localhost:3306/cardoil-bd
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
cardoil.jwt.secret=${JWT_SECRET:dev-only-secret-jamais-utilise-en-production-32-caracteres-minimum}
cardoil.jwt.expiration=86400000

logging.level.org.springframework.security=TRACE

# Mail
spring.mail.host=mail.cardoilbo-test.com
spring.mail.port=587
spring.mail.username=contacts@cardoilbo-test.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.default-encoding=UTF-8

# SMS Orange
orange.sms.api-url=${ORANGE_SMS_API_URL:https://api.orangesmspro.sn:8443/api}
orange.sms.login=${ORANGE_SMS_LOGIN:senpay}
orange.sms.token=${ORANGE_SMS_TOKEN:}
orange.sms.private-key=${ORANGE_SMS_PRIVATE_KEY:}
orange.sms.password=${ORANGE_SMS_PASSWORD:}
orange.sms.signature=${ORANGE_SMS_SIGNATURE:Senpay}
orange.sms.subject=${ORANGE_SMS_SUBJECT:CardOil_Notification}